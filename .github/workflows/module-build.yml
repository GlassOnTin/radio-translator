name: module-build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu_jammy
            image: ubuntu:22.04
          - distro: ubuntu_noble
            image: ubuntu:24.04
          - distro: debian_bookworm
            image: debian:12
          - distro: debian_trixie
            image: debian:13
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git cmake g++ make python3 pkg-config ca-certificates \
            libvolk-dev libfftw3-dev libglfw3-dev libglew-dev libzstd-dev \
            libwebsockets-dev libusb-1.0-0-dev libpulse-dev librtaudio-dev
      - uses: actions/checkout@v4
      - name: Build translator module (pinned SDR++ commit)
        run: |
          bash scripts/build_module.sh --sdrpp-dir /tmp/SDRPlusPlus --install-dir /tmp/out
          SHA=$(git -C /tmp/SDRPlusPlus rev-parse --short HEAD)
          mv /tmp/out/translator.so "/tmp/out/translator_${{ matrix.distro }}_amd64_sdrpp-${SHA}.so"
      - uses: actions/upload-artifact@v4
        with:
          name: translator_${{ matrix.distro }}
          path: /tmp/out/*.so

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach module binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.so
